services:
  bot:
    build: .
    container_name: portfolio-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/portfolio.db
    volumes:
      - botdata:/app/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  botdata:
